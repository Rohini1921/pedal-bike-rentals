<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedal | Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e5f4e9, #f5f7f5);
            color: #183b2b;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #176b45;
            margin-bottom: 8px;
        }

        h2 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b756e;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd6ce;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #80b99a;
            border-color: #176b45;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #176b45;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #105536;
        }

        .message {
            padding: 10px;
            border-radius: 7px;
            background: #fff0f0;
            color: #a32222;
            margin: 10px 0;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #176b45;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .admin-label {
            display: inline-block;
            background: #e5f4e9;
            color: #176b45;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="login-card">

        <div class="logo">Pedal 🚲</div>

        <span class="admin-label">ADMINISTRATOR</span>

        <h2>Welcome Back!</h2>

        <p class="subtitle">
            Sign in to manage your bikes, customers and bookings.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('admin_login') }}" method="POST">

            <label for="email">Admin Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter admin email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Login to Admin Panel</button>

        </form>

        <a href="/" class="back-link">← Back to Pedal Website</a>

    </div>
</body>
</html>
